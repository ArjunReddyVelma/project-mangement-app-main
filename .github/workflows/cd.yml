name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: project-management-dashboard
  EKS_CLUSTER_NAME: project-management-dev-eks

jobs:
  build-and-verify:
    name: Build, SBOM, and Security Gate
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      image_name: ${{ steps.tag.outputs.image_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Generate immutable Git SHA image tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          IMAGE_TAG="${SHORT_SHA}"
          IMAGE_NAME="project-dashboard:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building image: ${IMAGE_NAME}"

      - name: Build production Docker image
        run: |
          docker build --tag ${{ steps.tag.outputs.image_name }} .

      - name: Generate SBOM (SPDX format)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.60.0 image \
            --format spdx-json \
            --output sbom.spdx.json \
            ${{ steps.tag.outputs.image_name }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sbom-${{ steps.tag.outputs.image_tag }}
          path: sbom.spdx.json
          retention-days: 30

      - name: Scan container image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image_name }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Save container image archive
        run: |
          docker save -o image-${{ steps.tag.outputs.image_tag }}.tar ${{ steps.tag.outputs.image_name }}

      - name: Upload verified image archive
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: container-image-${{ steps.tag.outputs.image_tag }}
          path: image-${{ steps.tag.outputs.image_tag }}.tar
          retention-days: 1

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-verify
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download verified image archive
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: container-image-${{ needs.build-and-verify.outputs.image_tag }}

      - name: Load verified container image
        run: |
          docker load -i image-${{ needs.build-and-verify.outputs.image_tag }}.tar

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        continue-on-error: true
        id: aws-auth
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::123456789012:role/project-management-dev-github-cd-role' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.aws-auth.outcome == 'success'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@4625ce35226a7557230889aae2f52eb50ec3dcda # v2.0.1

      - name: Push image to Amazon ECR
        if: steps.aws-auth.outcome == 'success'
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          TARGET_IMAGE="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-verify.outputs.image_tag }}"
          docker tag ${{ needs.build-and-verify.outputs.image_name }} "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"
          echo "ECR_IMAGE=$TARGET_IMAGE" >> "$GITHUB_ENV"

      - name: Update kubeconfig
        if: steps.aws-auth.outcome == 'success'
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy to Kubernetes cluster
        id: deploy
        if: steps.aws-auth.outcome == 'success'
        run: |
          kubectl apply -f k8s/project-dashboard.yaml
          kubectl set image deployment/project-dashboard dashboard=${{ env.ECR_IMAGE }} -n project-dashboard

      - name: Wait for rollout completion
        id: rollout
        if: steps.deploy.outcome == 'success'
        run: |
          kubectl rollout status deployment/project-dashboard -n project-dashboard --timeout=180s

      - name: Verify application health
        if: steps.rollout.outcome == 'success'
        run: |
          kubectl get pods,svc,hpa -n project-dashboard

      - name: Automated rollback on deployment failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "Deployment or health check failed. Initiating automated rollback..."
          kubectl rollout undo deployment/project-dashboard -n project-dashboard
          kubectl rollout status deployment/project-dashboard -n project-dashboard --timeout=120s

      - name: Publish deployment summary
        if: always()
        run: |
          echo "### 🚀 DevOps CD Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target Environment** | \`${{ inputs.environment || 'staging' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Immutable Image Tag** | \`${{ needs.build-and-verify.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Security Gate Status** | ✅ 0 High/Critical Trivy Vulnerabilities |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **SBOM Generated** | ✅ SPDX-JSON Uploaded |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Deployment Status** | ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }} |" >> "$GITHUB_STEP_SUMMARY"
