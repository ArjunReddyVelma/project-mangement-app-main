apiVersion: v1
kind: Service
metadata:
  name: project-dashboard
  namespace: project-dashboard
  labels:
    app.kubernetes.io/name: project-dashboard
    app.kubernetes.io/part-of: devops-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9113"
    prometheus.io/path: /metrics
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: project-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
    - name: metrics
      port: 9113
      targetPort: metrics
      nodePort: 30113
