apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: project-dashboard
  namespace: project-dashboard
  labels:
    app.kubernetes.io/name: project-dashboard
    app.kubernetes.io/part-of: devops-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: project-dashboard
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
