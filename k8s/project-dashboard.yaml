apiVersion: v1
kind: Namespace
metadata:
  name: project-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-dashboard
  namespace: project-dashboard
  labels:
    app.kubernetes.io/name: project-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: project-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-dashboard
    spec:
      containers:
        - name: dashboard
          image: REPLACE_WITH_YOUR_ECR_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.4.1
          args:
            - --nginx.scrape-uri=http://127.0.0.1:8080/nginx_status
          ports:
            - containerPort: 9113
              name: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: project-dashboard
  namespace: project-dashboard
  labels:
    app.kubernetes.io/name: project-dashboard
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9113"
    prometheus.io/path: /metrics
spec:
  selector:
    app.kubernetes.io/name: project-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9113
      targetPort: metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: project-dashboard
  namespace: project-dashboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: project-dashboard
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
