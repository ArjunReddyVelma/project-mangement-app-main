groups:
  - name: project-dashboard-web-alerts
    rules:
      - alert: NginxServiceDown
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nginx web server is down"
          description: "Nginx exporter cannot scrape Nginx status endpoint on project-dashboard."

      - alert: HighActiveConnections
        expr: nginx_connections_active > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High number of active connections"
          description: "Active connections to Nginx exceeded 100 for more than 2 minutes."

      - alert: HighRequestRateSpike
        expr: rate(nginx_http_requests_total[1m]) > 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Unusual request spike detected"
          description: "HTTP request rate is higher than 500 req/sec."

      - alert: DroppedConnectionsDetected
        expr: (increase(nginx_connections_accepted[5m]) - increase(nginx_connections_handled[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nginx connection drop detected"
          description: "Client connections are being accepted but not handled, indicating resource exhaustion or worker starvation."

  - name: project-dashboard-k8s-workload-alerts
    rules:
      - alert: HighContainerCpuUsage
        expr: rate(container_cpu_usage_seconds_total{container="dashboard"}[2m]) > 0.8
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High container CPU utilization"
          description: "Container CPU utilization in Kubernetes exceeded 80% for 3 minutes."

      - alert: FrequentPodRestarts
        expr: increase(kube_pod_container_status_restarts_total{namespace="project-dashboard"}[15m]) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Frequent container restarts in Kubernetes"
          description: "Pod in namespace project-dashboard restarted more than 3 times in 15 minutes."

      - alert: DeploymentReplicasUnavailable
        expr: kube_deployment_status_replicas_available{deployment="project-dashboard"} < 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes available replicas below desired threshold"
          description: "Less than 2 replicas are available in deployment project-dashboard."
